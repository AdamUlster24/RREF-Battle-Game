name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install
        run: npm run setup
      - name: Typecheck server and shared engine
        run: npm run typecheck --prefix server
      - name: Test
        run: npm test
      - name: Lint client
        run: npm run lint --prefix client
      - name: Build
        run: npm run build
